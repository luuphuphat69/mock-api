name: Build, Push & Deploy (For server)

on:
  push:
    branches:
      - preview

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        working-directory: ./server
        run: docker build -t mockapi-server .

      - name: Tag image
        run: docker tag mockapi-server luuphuphat69/mockapi-server:latest

      - name: Push image
        run: docker push luuphuphat69/mockapi-server:latest

  deploy:
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Ruby (for Kamal)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2

      - name: Install Kamal
        run: gem install kamal

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
        
      - name: Load server/.env into environment
        run: |
            set -a
            source ./server/.env
            set +a

      - name: Deploy with Kamal
        run: kamal deploy