name: Trigger E2E Tests (After Preview deployment)

on:
  deployment_status:

jobs:
  e2e:
    if: |
      github.event.deployment_status.state == 'success' && 
      contains(github.event.deployment_status.environment, 'Preview')
    
    runs-on: ubuntu-latest
    environment: Preview 
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # Automatically caches node_modules
          cache-dependency-path: test-resources/e2e/package-lock.json

      - name: Install dependencies
        working-directory: test-resources/e2e
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        working-directory: test-resources/e2e
        run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> $GITHUB_ENV

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: test-resources/e2e
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: test-resources/e2e
        run: npx playwright test

      - name: Upload Report
        if: always() # Ensure report is uploaded even if tests fail
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-resources/e2e/playwright-report/
          retention-days: 1